name: Run Intelligent Functional Tests
on:
  push:
    paths:
      - 'tests/generated/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright package
        run: npm install -D @playwright/test playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run generated tests
        run: |
          if [ -d "tests/generated" ] && [ "$(ls -A tests/generated)" ]; then
            npx playwright test tests/generated/
          else
            echo "No generated tests found yet — skipping"
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
